name: Weather Satellite Report

on:
  schedule:
    # Runs every hour, at minute 0 (UTC time)
    - cron: "0 * * * *"
  workflow_dispatch: {}  # lets you manually trigger it from the GitHub Actions tab

jobs:
  send-weather-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run weather report script
        env:
          LATITUDE: ${{ secrets.LATITUDE }}
          LONGITUDE: ${{ secrets.LONGITUDE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LOCATION_NAME: ${{ secrets.LOCATION_NAME }}
        run: python weather_report.py
